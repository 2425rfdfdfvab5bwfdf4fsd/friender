[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pacca"
version = "8.0.0"
description = "Personal AI Computer-Control Agent — secure LLM-powered computer-control"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "agent", "llm", "automation", "computer-control"]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.28",
    "openai>=1.30",
    "aiofiles>=23",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "gitpython>=3.1",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
browser = ["playwright>=1.44", "playwright-stealth>=1.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
pacca = "main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["pacca*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP", "S", "B"]
ignore = ["S101", "S603", "S607", "B904"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
