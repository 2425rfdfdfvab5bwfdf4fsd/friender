<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PACCA v5.2 — AI Agent</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<style>
:root {
  --bg:#0d1117; --surface:#161b22; --surface2:#1c2128; --surface3:#21262d;
  --border:#30363d; --border2:#21262d;
  --accent:#58a6ff; --accent2:#3fb950; --warn:#e3b341; --danger:#f85149;
  --muted:#8b949e; --text:#e6edf3; --text2:#c9d1d9;
  --sidebar-w:340px; --hdr-h:48px; --quickbar-h:42px;
  --radius:6px; --radius-sm:4px;
  --shadow:0 4px 16px rgba(0,0,0,.4);
  --glow-accent:0 0 12px rgba(88,166,255,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Cascadia Code','Fira Code','Consolas',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Toasts ─────────────────────────────────────────────────────────────── */
#toast-container{position:fixed;top:60px;right:16px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:12px;max-width:320px;pointer-events:auto;animation:toastIn .25s ease;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.toast.ok{border-color:var(--accent2);color:var(--accent2)}
.toast.warn{border-color:var(--warn);color:var(--warn)}
.toast.err{border-color:var(--danger);color:var(--danger)}
.toast.info{border-color:var(--accent);color:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(20px)}}

/* ── Header ─────────────────────────────────────────────────────────────── */
#header{display:flex;align-items:center;gap:8px;padding:0 14px;height:var(--hdr-h);background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:20}
#logo{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.5px;white-space:nowrap;cursor:default;user-select:none}
#logo-sub{color:var(--muted);font-weight:400;font-size:10px;margin-left:6px}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .4s;cursor:default}
#status-dot.ok{background:var(--accent2);box-shadow:0 0 6px rgba(63,185,80,.5)}
#status-dot.warn{background:var(--warn)}
#provider-badge{font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px 8px;color:var(--muted);white-space:nowrap;cursor:default}
#provider-badge.live{color:var(--accent);border-color:rgba(88,166,255,.4);background:rgba(88,166,255,.08)}

/* Live system stats strip */
#sys-stats{display:flex;align-items:center;gap:12px;margin-left:6px}
.stat-chip{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);cursor:default;user-select:none}
.stat-chip .stat-label{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.6px}
.stat-bar-wrap{width:36px;height:5px;background:var(--border);border-radius:2px;overflow:hidden}
.stat-bar{height:5px;border-radius:2px;transition:width .6s ease,background .4s}
.stat-val{font-size:10px;min-width:26px;text-align:right}
.stat-val.ok{color:var(--accent2)}
.stat-val.warn{color:var(--warn)}
.stat-val.crit{color:var(--danger)}

.spacer{flex:1}
.hdr-btn{font:11px/1 monospace;background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:color .15s,border-color .15s,background .15s;white-space:nowrap}
.hdr-btn:hover{color:var(--text);border-color:var(--accent);background:rgba(88,166,255,.07)}
.hdr-btn.active{color:var(--accent);border-color:rgba(88,166,255,.5)}
#btn-fullscreen{padding:4px 8px}

/* ── Quick-action bar ───────────────────────────────────────────────────── */
#quickbar{display:flex;align-items:center;gap:6px;padding:0 14px;height:var(--quickbar-h);background:var(--surface2);border-bottom:1px solid var(--border2);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
#quickbar::-webkit-scrollbar{display:none}
#quickbar-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;flex-shrink:0}
.qa-btn{font:11px/1 monospace;background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:5px 11px;border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;display:flex;align-items:center;gap:5px}
.qa-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,.07)}
.qa-btn .qa-icon{font-size:12px}
.qa-sep{width:1px;height:18px;background:var(--border);flex-shrink:0;margin:0 2px}

/* ── Layout ─────────────────────────────────────────────────────────────── */
#main{display:flex;flex:1;overflow:hidden}

/* ── Terminal area ──────────────────────────────────────────────────────── */
#terminal-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-width:0}
#xterm-container{flex:1;padding:4px 2px;overflow:hidden}
.xterm-viewport::-webkit-scrollbar{width:6px}
.xterm-viewport::-webkit-scrollbar-track{background:transparent}
.xterm-viewport::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Autocomplete dropdown ──────────────────────────────────────────────── */
#autocomplete{position:absolute;bottom:calc(var(--quickbar-h) + 48px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-bottom:none;max-height:180px;overflow-y:auto;z-index:50;display:none;box-shadow:0 -4px 16px rgba(0,0,0,.4)}
#autocomplete.show{display:block}
.ac-item{padding:7px 14px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text2);border-bottom:1px solid var(--border2)}
.ac-item:hover,.ac-item.selected{background:rgba(88,166,255,.1);color:var(--text)}
.ac-item .ac-icon{font-size:11px;color:var(--muted);width:14px;text-align:center;flex-shrink:0}
.ac-item .ac-label{flex:1}
.ac-item .ac-hint{font-size:10px;color:var(--muted)}

/* ── Progress ───────────────────────────────────────────────────────────── */
#progress-wrap{padding:0 14px 6px;flex-shrink:0;display:none}
#progress-wrap.show{display:block}
#progress-track{background:var(--border);border-radius:2px;height:3px}
#progress-fill{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .4s ease;width:0}
#progress-label{font-size:9px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between}

/* ── Confirm bar ────────────────────────────────────────────────────────── */
#confirm-bar{display:none;align-items:center;gap:10px;padding:10px 14px;background:#1a1000;border-top:2px solid var(--warn);flex-shrink:0}
#confirm-bar.show{display:flex}
#confirm-bar.danger{background:#1a0000;border-color:var(--danger)}
#confirm-msg{flex:1;font-size:12px;color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#confirm-bar.danger #confirm-msg{color:var(--danger)}
#confirm-input{width:120px;background:var(--surface2);border:1px solid var(--warn);color:var(--text);padding:5px 8px;border-radius:var(--radius-sm);font-family:inherit;font-size:12px;outline:none}
#confirm-bar.danger #confirm-input{border-color:var(--danger)}
.conf-btn{padding:5px 14px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;white-space:nowrap}
#confirm-yes{background:var(--accent2);color:#0d1117}
#confirm-no{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}

/* ── Input bar ──────────────────────────────────────────────────────────── */
#input-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
#prompt{color:var(--accent);font-size:13px;white-space:nowrap;user-select:none}
#cmd-wrap{flex:1;position:relative}
#cmd-input{width:100%;background:transparent;border:none;outline:none;color:var(--text);font:13px/1.4 'Cascadia Code','Fira Code','Consolas',monospace;caret-color:var(--accent)}
#cmd-input::placeholder{color:var(--muted)}
#char-count{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--muted);display:none}
#dryrun-toggle{font-size:10px;padding:4px 9px;border-radius:var(--radius-sm);cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--muted);white-space:nowrap;transition:all .15s}
#dryrun-toggle.on{background:rgba(63,185,80,.1);border-color:var(--accent2);color:var(--accent2)}
#send-btn{font-size:12px;padding:6px 16px;border-radius:var(--radius-sm);cursor:pointer;background:var(--accent);border:none;color:#0d1117;font-weight:700;font-family:inherit;transition:opacity .15s,transform .1s;white-space:nowrap}
#send-btn:hover{opacity:.9;transform:scale(1.02)}
#send-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
#send-btn.running{background:var(--danger)}

/* ── Sidebar ────────────────────────────────────────────────────────────── */
#sidebar{width:var(--sidebar-w);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s ease;overflow:hidden}
#sidebar.collapsed{width:0}
#panel-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.ptab{flex:1;padding:9px 2px;font-size:10px;text-align:center;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptab.active{color:var(--accent);border-color:var(--accent)}
.ptab:hover{color:var(--text)}
.panel{display:none;flex:1;overflow-y:auto;padding:12px}
.panel.active{display:block}
.panel::-webkit-scrollbar{width:5px}
.panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── System monitor panel ───────────────────────────────────────────────── */
.sysmon-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sysmon-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.sysmon-card-title{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px}
.sysmon-val{font-size:20px;font-weight:700;line-height:1}
.sysmon-sub{font-size:9px;color:var(--muted);margin-top:3px}
.sysmon-bar{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.sysmon-bar-fill{height:4px;border-radius:2px;transition:width .6s}
.sysmon-bar-fill.ok{background:var(--accent2)}
.sysmon-bar-fill.warn{background:var(--warn)}
.sysmon-bar-fill.crit{background:var(--danger)}
.proc-list{margin-top:8px}
.proc-item{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--border2);font-size:10px}
.proc-item:last-child{border-bottom:none}
.proc-name{flex:1;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proc-cpu{color:var(--warn);width:36px;text-align:right;flex-shrink:0}
.proc-mem{color:var(--muted);width:36px;text-align:right;flex-shrink:0}
#sysmon-refresh-btn{width:100%;padding:6px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;font-size:11px;transition:all .15s;margin-top:8px}
#sysmon-refresh-btn:hover{color:var(--text);border-color:var(--accent)}

/* ── Tools panel ────────────────────────────────────────────────────────── */
.tool-search{width:100%;padding:6px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:11px;outline:none;margin-bottom:10px}
.tool-search:focus{border-color:var(--accent)}
.tool-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border2);cursor:pointer}
.tool-item:last-child{border-bottom:none}
.tool-item:hover{background:rgba(88,166,255,.04);margin:0 -4px;padding-left:4px;padding-right:4px;border-radius:var(--radius-sm)}
.tool-name{font-size:11px;color:var(--accent);font-weight:600}
.tool-desc{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.4}
.risk-badge{font-size:9px;padding:2px 6px;border-radius:3px;white-space:nowrap;flex-shrink:0;font-weight:700;margin-top:2px}
.risk-low{background:rgba(63,185,80,.15);color:var(--accent2)}
.risk-medium{background:rgba(227,179,65,.15);color:var(--warn)}
.risk-high{background:rgba(248,81,73,.15);color:var(--danger)}
.domain-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);padding:10px 0 4px;border-top:1px solid var(--border);margin-top:4px}
.domain-label:first-child{border-top:none;padding-top:0;margin-top:0}

/* ── History panel ──────────────────────────────────────────────────────── */
.hist-item{padding:8px;border-bottom:1px solid var(--border2);border-radius:var(--radius-sm);cursor:pointer;transition:background .12s;position:relative}
.hist-item:hover{background:rgba(88,166,255,.05)}
.hist-item:last-child{border-bottom:none}
.hist-cmd{font-size:11px;color:var(--text);line-height:1.4;padding-right:50px}
.hist-meta{font-size:9px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hist-status{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700}
.s-completed{background:rgba(63,185,80,.15);color:var(--accent2)}
.s-failed{background:rgba(248,81,73,.15);color:var(--danger)}
.s-cancelled{background:rgba(227,179,65,.15);color:var(--warn)}
.s-executing{background:rgba(88,166,255,.15);color:var(--accent)}
.s-dry_run{background:rgba(139,148,158,.1);color:var(--muted)}
.hist-rerun{position:absolute;right:8px;top:8px;font-size:9px;padding:2px 7px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--muted);cursor:pointer;transition:all .12s}
.hist-rerun:hover{color:var(--accent);border-color:var(--accent)}

/* ── Audit panel ────────────────────────────────────────────────────────── */
.audit-item{padding:6px 0;border-bottom:1px solid var(--border2);font-size:10px}
.audit-item:last-child{border-bottom:none}
.audit-event{color:var(--accent);font-weight:600}
.audit-tool{color:var(--accent2);margin-left:4px}
.audit-meta{color:var(--muted);margin-top:2px;line-height:1.5}

/* ── Settings panel ─────────────────────────────────────────────────────── */
.api-notice{font-size:11px;border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;line-height:1.6}
.api-notice.warn{color:var(--warn);background:rgba(227,179,65,.08);border:1px solid rgba(227,179,65,.3)}
.api-notice.ok{color:var(--accent2);background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.3)}
.api-notice a{color:var(--accent);text-decoration:none}
.api-notice a:hover{text-decoration:underline}
.setting-group{margin-bottom:12px}
.setting-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.setting-value{font-size:11px;color:var(--text);padding:6px 8px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.setting-input{width:100%;font-size:12px;color:var(--text);padding:6px 8px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);font-family:inherit;outline:none;transition:border-color .15s}
.setting-input:focus{border-color:var(--accent)}
select.setting-input option{background:var(--surface2)}
.save-btn{width:100%;padding:8px;border-radius:var(--radius-sm);border:none;cursor:pointer;background:var(--accent);color:#0d1117;font-weight:700;font-family:inherit;font-size:12px;margin-top:4px;transition:opacity .15s}
.save-btn:hover{opacity:.85}
.save-btn.sec{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.save-btn.sec:hover{color:var(--text);border-color:var(--accent)}
.setting-sep{border:none;border-top:1px solid var(--border);margin:12px 0}
.wa-section-title{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#25D366;margin-bottom:8px;margin-top:4px}
.wa-check{display:flex;align-items:center;gap:7px;font-size:10px;padding:4px 8px;border-radius:var(--radius-sm);margin-bottom:3px}
.wa-check.set{color:#25D366;background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.2)}
.wa-check.unset{color:var(--warn);background:rgba(227,179,65,.08);border:1px solid rgba(227,179,65,.2)}
.wa-step{display:flex;gap:8px;padding:3px 0;font-size:10px;color:var(--muted);line-height:1.5}
.wa-step-num{color:#25D366;font-weight:700;flex-shrink:0;width:14px;text-align:right}
.wa-step a{color:var(--accent);text-decoration:none}
.wa-step a:hover{text-decoration:underline}
.wa-test-btn{width:100%;padding:7px;border-radius:var(--radius-sm);border:1px solid #25D366;cursor:pointer;background:transparent;color:#25D366;font-weight:700;font-family:inherit;font-size:12px;margin-top:4px;transition:background .15s}
.wa-test-btn:hover{background:rgba(37,211,102,.08)}
#wa-test-result{font-size:10px;margin-top:6px;padding:6px 8px;border-radius:var(--radius-sm);display:none}
#wa-test-result.ok{display:block;color:#25D366;background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.2)}
#wa-test-result.err{display:block;color:var(--danger);background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.2)}
.wa-webhook-box{font-size:10px;padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);word-break:break-all;color:var(--text);cursor:pointer;margin-top:4px;transition:border-color .15s}
.wa-webhook-box:hover{border-color:var(--accent)}
.copy-hint{font-size:9px;color:var(--muted);margin-top:2px;display:block}

/* ── Onboarding modal ───────────────────────────────────────────────────── */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
#modal-overlay.hidden{display:none}
#modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:min(640px,92vw);max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
#modal-hdr{padding:16px 20px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px}
#modal-body{padding:18px 20px;overflow-y:auto;flex:1;font-size:12px;line-height:1.7}
#modal-body pre{white-space:pre-wrap;font-family:inherit}
#modal-ftr{padding:14px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modal-btn{padding:8px 20px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;transition:opacity .15s}
.modal-btn:hover{opacity:.85}
#btn-accept{background:var(--accent2);color:#0d1117}
#btn-decline{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
#prov-sel{padding:5px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:12px}
#prov-sel option{background:var(--surface2)}

/* ── Fullscreen ─────────────────────────────────────────────────────────── */
body.fullscreen #sidebar{display:none}
body.fullscreen #quickbar{display:none}
body.fullscreen #header .hdr-btn:not(#btn-fullscreen):not(#btn-toggle){display:none}
body.fullscreen #sys-stats{display:none}
</style>
</head>
<body>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Onboarding modal -->
<div id="modal-overlay" class="hidden">
  <div id="modal">
    <div id="modal-hdr">🔒 PACCA — First Run Setup</div>
    <div id="modal-body"><pre id="disclosure-text">Loading…</pre></div>
    <div id="modal-ftr">
      <label style="font-size:11px;color:var(--muted)">Provider:</label>
      <select id="prov-sel">
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="openai">OpenAI (GPT)</option>
        <option value="gemini">Google (Gemini)</option>
      </select>
      <div class="spacer"></div>
      <button class="modal-btn" id="btn-decline">Decline</button>
      <button class="modal-btn" id="btn-accept">Accept &amp; Start</button>
    </div>
  </div>
</div>

<!-- Header -->
<div id="header">
  <div id="logo">PACCA<span id="logo-sub">AI Agent v5.2</span></div>
  <div id="status-dot" title="Connecting…"></div>
  <div id="provider-badge">offline</div>

  <!-- Live system stats -->
  <div id="sys-stats">
    <div class="stat-chip" title="CPU Usage">
      <span class="stat-label">CPU</span>
      <div class="stat-bar-wrap"><div class="stat-bar" id="hdr-cpu-bar" style="width:0%;background:var(--accent2)"></div></div>
      <span class="stat-val ok" id="hdr-cpu-val">—</span>
    </div>

<script>
// ── Helpers ──────────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ── State ────────────────────────────────────────────────────────────────────
const S = {
  ws:null, term:null, fit:null,
  cmdHistory:[], histIdx:-1,
  dryRun:false, sidebarOpen:true, fullscreen:false,
  taskId:null, confirmId:null,
  totalSteps:0, doneSteps:0,
  running:false, acIdx:-1, acItems:[],
  lastSysStats:null,
};

// ── Common commands for autocomplete ────────────────────────────────────────
const SUGGESTIONS = [
  {icon:'📊', label:'show system cpu and memory usage', hint:'system'},
  {icon:'📁', label:'list files in current directory', hint:'file'},
  {icon:'🔍', label:'search for files named *.py', hint:'file'},
  {icon:'📄', label:'read the file README.md', hint:'file'},
  {icon:'✏️', label:'create a file called notes.txt with content "hello"', hint:'file'},
  {icon:'🗂', label:'find all pdf files in home directory', hint:'file'},
  {icon:'⚙', label:'show running apps and processes', hint:'system'},
  {icon:'🌿', label:'git status in current directory', hint:'git'},
  {icon:'🌿', label:'git add and commit all changes with message "update"', hint:'git'},
  {icon:'🌐', label:'search the web for', hint:'browser'},
  {icon:'🌐', label:'open url https://example.com', hint:'browser'},
  {icon:'📦', label:'zip folder ~/Documents to ~/backup.zip', hint:'file'},
  {icon:'↩', label:'undo', hint:'special'},
  {icon:'❓', label:'help', hint:'special'},
  {icon:'📋', label:'history', hint:'special'},
  {icon:'📊', label:'status', hint:'special'},
  {icon:'🔍', label:'dry-run: ', hint:'preview'},
];

// ── Colour codes ──────────────────────────────────────────────────────────────
const C = {
  rst:'\x1b[0m', bold:'\x1b[1m', dim:'\x1b[2m', ul:'\x1b[4m',
  blue:'\x1b[34m', cyan:'\x1b[36m', green:'\x1b[32m',
  yellow:'\x1b[33m', red:'\x1b[31m', mag:'\x1b[35m',
  white:'\x1b[97m', gray:'\x1b[90m', bblue:'\x1b[94m',
  bgreen:'\x1b[92m', bred:'\x1b[91m', byellow:'\x1b[93m',
};
const pr  = t => S.term && S.term.writeln(t);
const sep = (c=58) => pr(C.gray+'─'.repeat(c)+C.rst);
const ts  = () => C.gray+'['+new Date().toLocaleTimeString()+']'+C.rst+' ';

// ── Toast notifications ───────────────────────────────────────────────────────
function toast(msg, type='info', dur=3500) {
  const icons = {ok:'✓', warn:'⚠', err:'✖', info:'ℹ'};
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.innerHTML = `<span>${icons[type]||'ℹ'}</span><span>${esc(msg)}</span>`;
  const tc = document.getElementById('toast-container');
  tc.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastOut .25s ease forwards';
    setTimeout(() => el.remove(), 260);
  }, dur);
}

// ── Terminal init ─────────────────────────────────────────────────────────────
function initTerm() {
  S.term = new Terminal({
    theme:{
      background:'#0d1117',foreground:'#e6edf3',cursor:'#58a6ff',
      selectionBackground:'rgba(88,166,255,.25)',
      black:'#0d1117',red:'#f85149',green:'#3fb950',yellow:'#e3b341',
      blue:'#58a6ff',magenta:'#bc8cff',cyan:'#39c5cf',white:'#e6edf3',
      brightBlack:'#484f58',brightRed:'#ff7b72',brightGreen:'#56d364',
      brightYellow:'#e3b341',brightBlue:'#79c0ff',
      brightMagenta:'#d2a8ff',brightCyan:'#56d4dd',brightWhite:'#f0f6fc',
    },
    fontFamily:"'Cascadia Code','Fira Code','Courier New',monospace",
    fontSize:13, lineHeight:1.45, cursorBlink:true, cursorStyle:'bar',
    scrollback:8000, convertEol:true, allowProposedApi:true,
  });
  S.fit = new FitAddon.FitAddon();
  S.term.loadAddon(S.fit);
  S.term.open(document.getElementById('xterm-container'));
  S.fit.fit();
  window.addEventListener('resize', () => S.fit && S.fit.fit());
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connectWS() {
  const proto = location.protocol==='https:'?'wss:':'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws`);
  S.ws = ws;
  ws.onopen  = () => dot('ok');
  ws.onclose = () => {
    dot('warn'); badge('disconnected','');
    pr(C.yellow+'⚠ Disconnected — reconnecting in 3s…'+C.rst);
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => {};
  ws.onmessage = e => { try { const m=JSON.parse(e.data); route(m.type,m.data||{}); }catch(_){} };
}
function wsSend(obj) { if(S.ws&&S.ws.readyState===1) S.ws.send(JSON.stringify(obj)); }

function dot(cls) { document.getElementById('status-dot').className=cls; }
function badge(text,cls) { const el=document.getElementById('provider-badge'); el.textContent=text; el.className=cls; }

// ── Event router ──────────────────────────────────────────────────────────────
function route(type,d) {
  switch(type) {
    case 'welcome':              onWelcome(d); break;
    case 'status':               pr(ts()+C.gray+d.message+C.rst); break;
    case 'warning':              pr(ts()+C.yellow+'⚠ '+d.message+C.rst); break;
    case 'scope':                onScope(d); break;
    case 'plan':                 onPlan(d); break;
    case 'executing':            pr(ts()+C.cyan+'▶ Executing…'+C.rst); break;
    case 'step_start':           onStepStart(d); break;
    case 'step_complete':        onStepComplete(d); break;
    case 'step_error':           pr(ts()+C.red+'  ✖ '+d.error+C.rst); break;
    case 'completed':            onCompleted(d); break;
    case 'dry_run_complete':     onDryRunDone(d); break;
    case 'cancelled':            onCancelled(d); break;
    case 'error':                onError(d); break;
    case 'confirmation_required':onConfirmReq(d); break;
    case 'help':                 onHelp(d); break;
    case 'tools':                onToolsTxt(d); break;
    case 'status_info':          onStatusInfo(d); break;
    case 'undo_result':          onUndoResult(d); break;
    case 'history':              onHistoryTxt(d); break;
    case 'audit_log':            onAuditTxt(d); break;
    case 'disclosure':           showModal(d.text); break;
    case 'pong':                 break;
    default: break;
  }
}

// ── Event handlers ────────────────────────────────────────────────────────────
function onWelcome(d) {
  badge(d.provider+' / '+d.model, d.llm_available?'live':'');
  dot('ok');
  pr('');
  pr(C.bold+C.bblue+'  ██████╗  █████╗  ██████╗  ██████╗  █████╗ '+C.rst);
  pr(C.bold+C.bblue+'  ██╔══██╗██╔══██╗██╔════╝ ██╔════╝ ██╔══██╗'+C.rst);
  pr(C.bold+C.bblue+'  ██████╔╝███████║██║      ██║      ███████║'+C.rst);
  pr(C.bold+C.bblue+'  ██╔═══╝ ██╔══██║██║      ██║      ██╔══██║'+C.rst);
  pr(C.bold+C.bblue+'  ██║     ██║  ██║╚██████╗ ╚██████╗ ██║  ██║'+C.rst);
  pr(C.bold+C.bblue+'  ╚═╝     ╚═╝  ╚═╝ ╚═════╝  ╚═════╝ ╚═╝  ╚═╝'+C.rst);
  pr('  '+C.gray+'Personal AI Computer-Control Agent  v5.2'+C.rst);
  sep();
  if (d.llm_available) {
    pr('  '+C.bgreen+'✓ LLM Connected'+C.rst+'  '+C.gray+d.provider+' / '+C.white+d.model+C.rst);
  } else {
    pr('  '+C.yellow+'⚠  No API key detected — running in heuristic demo mode'+C.rst);
    pr('  '+C.gray+'To enable full AI planning, add your key in '+C.cyan+'⚙ Settings'+C.gray+' → Secrets'+C.rst);
    pr('  '+C.gray+'  ANTHROPIC_API_KEY  •  OPENAI_API_KEY  •  GEMINI_API_KEY'+C.rst);
  }
  pr('');
  pr('  '+C.gray+'Type a command below, click a '+C.cyan+'Quick Action'+C.gray+' above, or type '+C.cyan+'help'+C.rst);
  pr('  '+C.gray+'Use '+C.cyan+'dry-run:'+C.gray+' prefix to preview without executing anything'+C.rst);
  pr('');
  pr('  '+C.gray+'Examples:'+C.rst);
  pr('  '+C.cyan+'  list files in my downloads folder'+C.rst);
  pr('  '+C.cyan+'  show system cpu and memory usage'+C.rst);
  pr('  '+C.cyan+'  search the web for latest Python news'+C.rst);
  pr('  '+C.cyan+'  create a file called todo.txt with content "Buy milk"'+C.rst);
  pr('');
  if (!d.onboarding_complete) fetchAndShowModal();
  loadTools();
  loadSettings();
  loadSysmon();
  // Start auto-refresh of header stats every 8 seconds
  refreshHeaderStats();
  setInterval(refreshHeaderStats, 8000);
}

function onScope(d) {
  S.taskId = d.task_id;
  pr(ts()+C.gray+'Scope → '+C.mag+d.intent_domain+' / '+d.intent_verb+(d.dry_run?' [DRY-RUN]':'')+C.rst);
}

function onPlan(d) {
  S.taskId = d.task_id;
  S.totalSteps = d.steps.length;
  S.doneSteps  = 0;
  S.running    = true;
  setSendRunning(true);
  const rc = d.risk_score>=200?C.bred:d.risk_score>=100?C.byellow:C.bgreen;
  pr('');
  pr(C.bold+C.white+'  📋 PLAN'+(d.dry_run?' [DRY-RUN]':'')+C.rst+
     '  '+C.gray+d.steps.length+' step'+(d.steps.length!==1?'s':'')+
     '  risk '+rc+Math.round(d.risk_score)+C.rst+(d.risk_gate?' '+C.yellow+'['+d.risk_gate+']'+C.rst:''));
  sep();
  d.steps.forEach((s,i) => {
    const rl = (s.risk_level||'low').toUpperCase();
    const rc2 = rl==='HIGH'?C.bred:rl==='MEDIUM'?C.byellow:C.bgreen;
    const rev = s.reversible?'':C.gray+' ⚠ irreversible'+C.rst;
    pr('  '+C.gray+(i+1)+'.'+C.rst+' '+C.cyan+(s.tool||'').padEnd(30)+C.rst+' '+rc2+'['+rl+']'+C.rst+rev);
    if(s.description) pr('     '+C.gray+s.description.substring(0,90)+C.rst);
    Object.entries(s.args_preview||{}).forEach(([k,v]) => {
      if(v) pr('     '+C.gray+k+': '+C.dim+String(v).substring(0,80)+C.rst);
    });
  });
  sep();
  if(d.steps.length && !d.dry_run) showProgress(0, d.steps.length, 'Starting…');
}

function onStepStart(d) {
  pr(ts()+C.cyan+'  → ['+d.step_number+'/'+d.total_steps+'] '+C.white+d.tool+C.rst+
     (d.description?C.gray+'  '+d.description.substring(0,70)+C.rst:''));
}

function onStepComplete(d) {
  S.doneSteps++;
  updateProgress(S.doneSteps, S.totalSteps, d.tool);
  const res = d.result||{};

  if(res.error){
    pr(ts()+C.bred+'  ✖ '+res.error+C.rst); return;
  }

  // ── Rich output rendering ────────────────────────────────────────────────
  if(res.entries && Array.isArray(res.entries)){
    const dirs = res.entries.filter(e=>(e.is_dir||e.type==='directory'));
    const files = res.entries.filter(e=>!(e.is_dir||e.type==='directory'));
    const all = [...dirs, ...files].slice(0,50);
    if(all.length){
      pr('');
      all.forEach(e => {
        const obj = typeof e==='object'?e:{name:e};
        const isDir = obj.is_dir||obj.type==='directory';
        const icon = isDir?'📁':'📄';
        const nameColor = isDir?C.cyan:C.white;
        const size = obj.size_str?C.gray+'  '+obj.size_str+C.rst:'';
        const mod = obj.modified?C.gray+'  '+obj.modified+C.rst:'';
        pr('  '+icon+' '+nameColor+(obj.name||String(e))+C.rst+size+mod);
      });
      if((res.total_count||0)>50) pr('  '+C.gray+'… and '+(res.total_count-50)+' more'+C.rst);
    }
    pr('  '+C.green+'✓ '+C.gray+(res.total_count||all.length)+' item(s) listed'+C.rst);

  } else if(res.content){
    const lines = String(res.content).split('\n');
    const preview = lines.slice(0,35);
    pr('');
    pr(C.gray+'  ┌─ '+d.tool+' ─ '+lines.length+' line'+(lines.length!==1?'s':'')+' ─'+C.rst);
    preview.forEach(l => pr('  │ '+C.dim+l.substring(0,110)+C.rst));
    if(lines.length>35) pr('  │ '+C.gray+'  … ('+( lines.length-35)+' more lines)'+C.rst);
    pr(C.gray+'  └' + '─'.repeat(40)+C.rst);

  } else if(res.results && Array.isArray(res.results)){
    pr('');
    res.results.slice(0,30).forEach(r => pr('  📄 '+C.white+(r.path||r)+C.rst));
    if((res.count||res.results.length)>30) pr('  '+C.gray+'… and '+((res.count||res.results.length)-30)+' more'+C.rst);
    pr('  '+C.green+'✓ '+C.gray+(res.count||res.results.length)+' result(s)'+C.rst);

  } else if(res.cpu!==undefined || res.cpu_percent!==undefined){
    // System monitor — rich display
    const cpu  = res.cpu?.percent ?? res.cpu_percent ?? 0;
    const ram  = res.memory?.used_percent ?? res.ram_percent ?? 0;
    const disk = res.disk?.used_percent ?? res.disk_usage_percent ?? 0;
    const uptime = res.uptime_hours ? (res.uptime_hours+'h uptime') : (res.uptime_str||'');
    pr('');
    pr(C.bold+'  System Overview'+C.rst);
    sep(40);
    function bar(v,w=20){const f=Math.round(v/100*w);const c=v>80?C.bred:v>60?C.byellow:C.bgreen;return c+'█'.repeat(f)+C.gray+'░'.repeat(w-f)+C.rst+' '+String(Math.round(v)).padStart(3)+'%';}
    pr('  CPU  '+bar(cpu));
    pr('  RAM  '+bar(ram));
    pr('  DISK '+bar(disk));
    if(uptime) pr('  '+C.gray+'Uptime: '+uptime+C.rst);
    const cpuCount = res.cpu?.count||res.cpu_count;
    if(cpuCount) pr('  '+C.gray+'Cores: '+cpuCount+'  Platform: '+(res.platform||'?')+C.rst);
    const procs = res.top_processes||res.processes;
    if(procs && procs.length){
      pr('');
      pr(C.gray+'  PID    NAME                    CPU%   MEM%'+C.rst);
      sep(40);
      procs.slice(0,8).forEach(p => {
        const n = (p.name||'?').substring(0,22).padEnd(22);
        const c2 = p.cpu_percent>5?C.byellow:C.gray;
        pr('  '+String(p.pid||0).padEnd(6)+C.text+n+C.rst+c2+String(p.cpu_percent||0).padStart(5)+'%'+C.rst+C.gray+String(p.memory_percent||0).padStart(6)+'%'+C.rst);
      });
    }
    // Also refresh the sidebar panel
    loadSysmon();

  } else if(res.apps && Array.isArray(res.apps)){
    pr('');
    pr(C.bold+'  Running Apps'+C.rst); sep(30);
    res.apps.slice(0,25).forEach(a => pr('  '+C.bgreen+'●'+C.rst+' '+(a.name||a).padEnd(25)+(a.pid?C.gray+'[PID: '+a.pid+']'+C.rst:'')));
    pr('  '+C.gray+res.apps.length+' app(s) running'+C.rst);

  } else if(res.status && res.branch !== undefined){
    // Git status
    pr('');
    pr(C.bold+'  Git Status'+C.rst); sep(30);
    pr('  Branch: '+C.bgreen+res.branch+C.rst);
    if(res.staged && res.staged.length) { pr('  Staged:'); res.staged.forEach(f=>pr('    '+C.bgreen+'+ '+f+C.rst)); }
    if(res.modified && res.modified.length) { pr('  Modified:'); res.modified.forEach(f=>pr('    '+C.byellow+'M '+f+C.rst)); }
    if(res.untracked && res.untracked.length) { pr('  Untracked:'); res.untracked.forEach(f=>pr('    '+C.gray+'? '+f+C.rst)); }
    if(!res.staged?.length && !res.modified?.length && !res.untracked?.length) pr('  '+C.bgreen+'✓ Working tree clean'+C.rst);

  } else if(res.diff !== undefined){
    pr('');
    const diffLines = String(res.diff||'(no diff)').split('\n');
    pr(C.gray+'  ┌─ git diff ───'+C.rst);
    diffLines.slice(0,40).forEach(l => {
      if(l.startsWith('+')) pr('  │ '+C.bgreen+l.substring(0,110)+C.rst);
      else if(l.startsWith('-')) pr('  │ '+C.bred+l.substring(0,110)+C.rst);
      else if(l.startsWith('@@')) pr('  │ '+C.cyan+l.substring(0,110)+C.rst);
      else pr('  │ '+C.gray+l.substring(0,110)+C.rst);
    });
    if(diffLines.length>40) pr('  │ '+C.gray+'… ('+(diffLines.length-40)+' more lines)'+C.rst);
    pr(C.gray+'  └'+C.rst);

  } else if(res.output){
    String(res.output).split('\n').slice(0,30).forEach(l => pr('  '+C.gray+l.substring(0,110)+C.rst));
  } else if(res.text){
    String(res.text).split('\n').slice(0,25).forEach(l => pr('  '+C.dim+l.substring(0,110)+C.rst));
  } else if(res.page_text){
    const lines = String(res.page_text).split('\n');
    pr(C.gray+'  ┌─ page content ─ '+lines.length+' lines ─'+C.rst);
    lines.slice(0,20).forEach(l => pr('  │ '+C.dim+l.substring(0,110)+C.rst));
    if(lines.length>20) pr('  │ '+C.gray+'… ('+(lines.length-20)+' more)'+C.rst);
    pr(C.gray+'  └'+C.rst);
  }

  // Short success footer
  const skip = ['content','entries','results','apps','output','top_processes','text',
                 'page_text','processes','cpu','memory','disk','cpu_percent','ram_percent',
                 'disk_usage_percent','uptime_hours','uptime_str','diff','status','branch',
                 'staged','modified','untracked'];
  const snippets=[];
  for(const [k,v] of Object.entries(res)){
    if(skip.includes(k)) continue;
    if(typeof v==='string'&&v.length<=80) snippets.push(k+': '+v.substring(0,55));
    else if(typeof v==='number') snippets.push(k+': '+v);
    else if(typeof v==='boolean'&&v) snippets.push(k);
  }
  if(snippets.length) pr('  '+C.bgreen+'✓ '+snippets.slice(0,4).join('  •  ')+C.rst);
  else if(!res.entries && !res.content && !res.results && !res.apps && !res.cpu &&
          res.cpu_percent===undefined && !res.output && !res.text && !res.page_text)
    pr('  '+C.bgreen+'✓ done'+C.rst);
}

  const ok  = (d.results_summary||[]).filter(r=>r.success).length;

  pr('');
  sep();
  pr(C.bold+C.bgreen+'  ✓ Task Complete'+C.rst+C.gray+'  '+ok+'/'+tot+' step'+(tot!==1?'s':'')+' succeeded'+C.rst);
  if(d.can_undo) pr('  '+C.gray+'Tip: type '+C.cyan+'undo'+C.gray+' to reverse the last action'+C.rst);
  pr('');
  loadHistory(); loadAudit();
  toast('Task complete — '+ok+'/'+tot+' steps succeeded', 'ok');
}

// ── Autocomplete ──────────────────────────────────────────────────────────────
const acEl = document.getElementById('autocomplete');

function updateAC(val) {
  if(!val||val.length<2){ closeAC(); return; }
  const v=val.toLowerCase();
  const matches = SUGGESTIONS.filter(s=>s.label.toLowerCase().includes(v) ||
    (S.cmdHistory||[]).some(h=>h.toLowerCase().startsWith(v)));
  // Also add history matches
  const histMatches = (S.cmdHistory||[])
    .filter(h=>h.toLowerCase().includes(v))
    .slice(0,5)
    .map(h=>({icon:'🕐',label:h,hint:'history'}));
  const all = [...histMatches, ...matches].filter((m,i,a)=>a.findIndex(x=>x.label===m.label)===i).slice(0,8);
  if(!all.length){ closeAC(); return; }
  S.acItems=all; S.acIdx=-1;
  acEl.innerHTML=all.map((m,i)=>
    `<div class="ac-item" data-idx="${i}" onclick="pickAC(${i})">
      <span class="ac-icon">${m.icon}</span>
      <span class="ac-label">${esc(m.label)}</span>
      <span class="ac-hint">${esc(m.hint)}</span>
    </div>`
  ).join('');
  acEl.classList.add('show');
}

function closeAC(){ acEl.classList.remove('show'); S.acItems=[]; S.acIdx=-1; }

function pickAC(i){
  const item=S.acItems[i];
  if(!item) return;
  document.getElementById('cmd-input').value=item.label;
  closeAC();
  document.getElementById('cmd-input').focus();
}

function acNav(dir){
  if(!S.acItems.length) return false;
  S.acIdx=Math.max(-1,Math.min(S.acItems.length-1,S.acIdx+dir));
  acEl.querySelectorAll('.ac-item').forEach((el,i)=>el.classList.toggle('selected',i===S.acIdx));
  if(S.acIdx>=0) document.getElementById('cmd-input').value=S.acItems[S.acIdx].label;
  return true;
}

// ── Command input ─────────────────────────────────────────────────────────────
function sendCommand() {
  if(S.running){
    // Stop running task
    if(S.taskId) wsSend({type:'cancel',data:{task_id:S.taskId}});
    S.running=false; setSendRunning(false);
    return;
  }
  closeAC();
  const input=document.getElementById('cmd-input');
  const cmd=input.value.trim();
  if(!cmd) return;

  let finalCmd=cmd;
  if(S.dryRun && !cmd.toLowerCase().startsWith('dry-run:') && !cmd.toLowerCase().startsWith('dry run:')){
    finalCmd='dry-run: '+cmd;
  }
  S.cmdHistory.unshift(cmd);
  if(S.cmdHistory.length>200) S.cmdHistory.pop();
  S.histIdx=-1;

  pr('');
  pr(C.bold+C.blue+'› '+C.rst+C.white+cmd+C.rst+(S.dryRun?C.yellow+' [dry-run]'+C.rst:''));

  wsSend({type:'command',data:{command:finalCmd}});
  input.value='';
  input.focus();
}

const cmdInput=document.getElementById('cmd-input');
cmdInput.addEventListener('input', e=>updateAC(e.target.value));
cmdInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ if(S.acIdx>=0){pickAC(S.acIdx);closeAC();}else sendCommand(); return; }
  if(e.key==='Escape'){ closeAC(); return; }
  if(e.key==='ArrowUp'){
    if(S.acItems.length){ e.preventDefault(); acNav(-1); return; }
    S.histIdx=Math.min(S.histIdx+1,S.cmdHistory.length-1);
    e.target.value=S.cmdHistory[S.histIdx]||'';
    e.preventDefault(); return;
  }
  if(e.key==='ArrowDown'){
    if(S.acItems.length){ e.preventDefault(); acNav(1); return; }
    S.histIdx=Math.max(S.histIdx-1,-1);
    e.target.value=S.histIdx>=0?S.cmdHistory[S.histIdx]:'';
    e.preventDefault(); return;
  }
  if(e.key==='Tab'){ e.preventDefault(); if(S.acIdx<0&&S.acItems.length) acNav(1); else if(S.acIdx>=0) pickAC(S.acIdx); return; }
});
document.addEventListener('click',e=>{ if(!acEl.contains(e.target)&&e.target!==cmdInput) closeAC(); });

function renderTools(tools){
  const c=document.getElementById('panel-tools');
  c.innerHTML=`<input class="tool-search" id="tool-search-inp" placeholder="Search tools…" oninput="filterTools(this.value)">
    <div id="tool-list"></div>`;

  renderToolList(tools);

function renderToolList(tools){
  const c=document.getElementById('tool-list');
  if(!c) return;
  const groups={};
  tools.forEach(t=>{ (groups[t.domain]||(groups[t.domain]=[])).push(t); });
  c.innerHTML='';
  for(const [dom,items] of Object.entries(groups)){
    const lbl=document.createElement('div');
    lbl.className='domain-label';
    lbl.textContent=dom.toUpperCase()+' ('+items.length+')';
    c.appendChild(lbl);
    items.forEach(t=>{
      const div=document.createElement('div');
      div.className='tool-item';
      div.title='Click to use this tool';
      div.onclick=()=>{ document.getElementById('cmd-input').value=t.name.replace(/_/g,' ')+' '; document.getElementById('cmd-input').focus(); };
      const rl=(t.risk_level||'low').toLowerCase();
      const flags=[
        t.reversible?'<span style="font-size:9px;color:var(--accent2)">↩rev</span>':'',
        t.data_egress?'<span style="font-size:9px;color:var(--warn)">☁egress</span>':'',
        t.requires_confirmation?'<span style="font-size:9px;color:var(--danger)">⚠confirm</span>':'',
        t.undo_supported?'<span style="font-size:9px;color:var(--muted)">undo</span>':'',
      ].filter(Boolean).join(' ');
      div.innerHTML=`<div style="flex:1;min-width:0">
        <div class="tool-name">${esc(t.name)}</div>
        <div class="tool-desc">${esc(t.description)}</div>
        <div style="margin-top:3px;display:flex;gap:4px;flex-wrap:wrap">${flags}</div>
      </div><div><span class="risk-badge risk-${rl}">${rl}</span></div>`;
      c.appendChild(div);
    });
  }
}
function filterTools(q){
  if(!window._allTools) return;
  const v=q.toLowerCase();
  renderToolList(v?window._allTools.filter(t=>t.name.includes(v)||t.description.toLowerCase().includes(v)||t.domain.includes(v)):window._allTools);
}

    const cmd=(r.command_short||r.command_redacted||'').substring(0,70);
    div.innerHTML=`
      <div class="hist-cmd">${esc(cmd)}</div>
      <div class="hist-meta">
        <span class="hist-status s-${esc(r.status)}">${esc(r.status)}</span>
        <span>${esc(r.intent_domain)}</span>
        ${dur?'<span>'+dur+'</span>':''}
        ${risk?'<span>'+esc(risk)+'</span>':''}
        <span>${r.steps_executed}/${r.steps_total} steps</span>
      </div>
      <button class="hist-rerun" onclick="qa(${JSON.stringify(esc(r.command_redacted||r.command_short||''))})">▶ Re-run</button>`;
    p.appendChild(div);
  });
}

// ── Audit panel ───────────────────────────────────────────────────────────────
async function loadAudit(){
  try{ const r=await fetch('/api/audit-log?n=50'); const d=await r.json(); renderAudit(d.entries||[]); }catch(_){}
}
function renderAudit(entries){
  const p=document.getElementById('panel-audit');
  if(!entries.length){ p.innerHTML='<div style="color:var(--muted);font-size:11px">No audit entries yet.</div>'; return; }
  p.innerHTML='';
  entries.forEach(e=>{
    const div=document.createElement('div');
    div.className='audit-item';
    const t2=e.timestamp?new Date(e.timestamp*1000).toLocaleTimeString():'';
    div.innerHTML=`<span class="audit-event">${esc(e.event_type||e.raw||'?')}</span>`+
      (e.tool_name?` <span class="audit-tool">${esc(e.tool_name)}</span>`:'')+
      `<div class="audit-meta">${esc(t2)}${e.result_summary?'  '+esc(e.result_summary.substring(0,60)):''}</div>`;
    p.appendChild(div);
  });
}

// ── Settings panel ────────────────────────────────────────────────────────────
let _statusCache={};
async function loadSettings(){
  try{ const r=await fetch('/api/status'); _statusCache=await r.json(); renderSettings(_statusCache); }catch(_){}
}
function renderSettings(d){
  const p=document.getElementById('panel-settings');
  const ok=d.llm_available;
  const cb=d.circuit_breaker||{};
  p.innerHTML=`
    <div class="api-notice ${ok?'ok':'warn'}">
${ok
  ? `✓ AI connected — ${esc(d.provider)} / ${esc(d.model)}`
  : `⚠ No API key — heuristic demo mode.\n\nTo enable full AI:\n• Go to Replit Secrets (🔒 in the left sidebar)\n• Add ANTHROPIC_API_KEY, OPENAI_API_KEY, or GEMINI_API_KEY\n• Restart the app`}
    </div>
    ${cb.state==='open'?`<div class="api-notice warn">⚡ Circuit breaker OPEN — ${cb.failure_count} failures. Resets in ${Math.round(cb.reset_in||0)}s</div>`:''}
    <div class="setting-group">
      <div class="setting-label">Provider</div>
      <select class="setting-input" id="s-prov">
        <option value="anthropic" ${d.provider==='anthropic'?'selected':''}>Anthropic (Claude)</option>
        <option value="openai" ${d.provider==='openai'?'selected':''}>OpenAI (GPT-4)</option>
        <option value="gemini" ${d.provider==='gemini'?'selected':''}>Google (Gemini)</option>
      </select>
    </div>
    <div class="setting-group">
      <div class="setting-label">Model</div>
      <input class="setting-input" id="s-model" value="${esc(d.model||'')}">
    </div>
    <div class="setting-group">
      <div class="setting-label">Risk confirm threshold (0–300)</div>
      <input class="setting-input" id="s-confirm" type="number" value="${d.risk_confirm_threshold||100}">
    </div>
    <div class="setting-group">
      <div class="setting-label">Risk proceed threshold (0–100)</div>
      <input class="setting-input" id="s-proceed" type="number" value="${d.risk_proceed_threshold||30}">
    </div>
    <button class="save-btn" onclick="saveSettings()">💾 Save &amp; Restart Agent</button>
    <hr class="setting-sep">
    <div class="setting-group">
      <div class="setting-label">Audit log</div>
      <div class="setting-value" style="font-size:10px;word-break:break-all">~/.pacca/audit.log</div>
    </div>
    <div class="setting-group">
      <div class="setting-label">Version / Tools</div>
      <div class="setting-value">PACCA ${esc(d.version||'5.2.0')} • ${(d.tool_count||0)} tools loaded</div>
    </div>
    <button class="save-btn sec" onclick="undoLast()">↩ Undo Last Action</button>
    <hr class="setting-sep">
    ${renderWASection(d)}`;
}

async function saveSettings(){
  const body={
    provider:document.getElementById('s-prov').value,
    model:document.getElementById('s-model').value,
    risk_confirm_threshold:parseFloat(document.getElementById('s-confirm').value),
    risk_proceed_threshold:parseFloat(document.getElementById('s-proceed').value),
  };
  try{
    await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    toast('Settings saved — agent restarted','ok');
    setTimeout(loadSettings,500);
  }catch(e){ toast('Failed to save: '+e.message,'err'); }
}

async function undoLast(){
  try{ const r=await fetch('/api/undo',{method:'POST'}); const d=await r.json(); route('undo_result',d); }catch(_){}
}

function renderWASection(d){
  const s=d.whatsapp_secrets||{};
  const configured=d.whatsapp_configured;
  const webhookUrl=window.location.origin+'/webhook/whatsapp';
  const chk=(set,label)=>`<div class="wa-check ${set?'set':'unset'}">${set?'✓':'✗'} ${esc(label)}</div>`;
  return `<div class="wa-section-title">📱 WhatsApp Integration</div>
    <div class="api-notice ${configured?'ok':'warn'}">
${configured?`✓ Connected — ${d.whatsapp_allowed_count||0} authorised number(s)`:
`○ Not configured — see setup steps below`}
    </div>
    ${chk(s.access_token,'WHATSAPP_ACCESS_TOKEN')}
    ${chk(s.phone_number_id,'WHATSAPP_PHONE_NUMBER_ID')}
    ${chk(s.verify_token,'WHATSAPP_VERIFY_TOKEN')}
    ${chk(s.allowed_numbers,'WHATSAPP_ALLOWED_NUMBERS')}
    ${chk(s.webhook_secret,'WHATSAPP_WEBHOOK_SECRET (optional)')}
    <hr class="setting-sep">
    <div class="setting-label">Setup Steps</div>
    <div class="wa-step"><span class="wa-step-num">1</span><span>Create a Meta app at <a href="https://developers.facebook.com" target="_blank">developers.facebook.com</a></span></div>
    <div class="wa-step"><span class="wa-step-num">2</span><span>Add the 5 Replit Secrets above</span></div>
    <div class="wa-step"><span class="wa-step-num">3</span><span>Set webhook URL to:</span></div>
    <div class="wa-webhook-box" onclick="navigator.clipboard.writeText('${esc(webhookUrl)}');toast('Webhook URL copied!','ok',2000)">${esc(webhookUrl)}</div>
    <span class="copy-hint">Click to copy</span>
    <button class="wa-test-btn" onclick="testWA()">🧪 Test WhatsApp Connection</button>
    <div id="wa-test-result"></div>`;
}

async function testWA(){
  const r=document.getElementById('wa-test-result');
  r.className=''; r.textContent='Testing…'; r.style.display='block';
  try{
    const res=await fetch('/api/whatsapp-test');
    const d=await res.json();
    if(d.ok){ r.className='ok'; r.textContent=`✓ Connected — ${d.name} (${d.phone}) • quality: ${d.quality}`; }
    else{ r.className='err'; r.textContent='✖ '+d.error+(d.detail?'\n'+d.detail:''); }
  }catch(e){ r.className='err'; r.textContent='✖ '+e.message; }
}

// ── Init ──────────────────────────────────────────────────────────────────────
initTerm();
connectWS();

// Keyboard shortcuts
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){ e.preventDefault(); pr(''); }
  if((e.ctrlKey||e.metaKey)&&e.key==='/'){ e.preventDefault(); document.getElementById('cmd-input').focus(); }
  if(e.key==='Escape'&&S.fullscreen){ toggleFullscreen(); }
});
</script>
