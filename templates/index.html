<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PACCA v5.2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<style>
:root {
  --bg:#0d1117; --surface:#161b22; --surface2:#1c2128; --border:#30363d;
  --accent:#58a6ff; --accent2:#3fb950; --warn:#e3b341; --danger:#f85149;
  --muted:#8b949e; --text:#e6edf3; --sidebar-w:320px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Cascadia Code','Fira Code',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Header */
#header{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:20}
#logo{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.5px;white-space:nowrap}
#logo span{color:var(--muted);font-weight:400;font-size:11px;margin-left:6px}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
#status-dot.ok{background:var(--accent2)}
#status-dot.warn{background:var(--warn)}
#provider-badge{font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--muted);white-space:nowrap;margin-left:4px}
#provider-badge.live{color:var(--accent);border-color:var(--accent)}
#wa-badge{font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--muted);white-space:nowrap;margin-left:4px}
#wa-badge.live{color:#25D366;border-color:#25D366}
.spacer{flex:1}
.hdr-btn{font:11px/1 monospace;background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:4px;cursor:pointer;transition:color .15s,border-color .15s}
.hdr-btn:hover{color:var(--text);border-color:var(--accent)}

/* Layout */
#main{display:flex;flex:1;overflow:hidden}

/* Terminal area */
#terminal-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#xterm-container{flex:1;padding:4px 2px;overflow:hidden}
.xterm-viewport::-webkit-scrollbar{width:6px}
.xterm-viewport::-webkit-scrollbar-track{background:transparent}
.xterm-viewport::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Progress */
#progress-wrap{padding:0 14px 5px;flex-shrink:0;display:none}
#progress-wrap.show{display:block}
#progress-track{background:var(--border);border-radius:2px;height:3px}
#progress-fill{height:3px;background:var(--accent);border-radius:2px;transition:width .3s;width:0}
#progress-label{font-size:9px;color:var(--muted);margin-top:2px}

/* Confirm bar */
#confirm-bar{display:none;align-items:center;gap:10px;padding:10px 14px;background:#1a1000;border-top:2px solid var(--warn);flex-shrink:0}
#confirm-bar.show{display:flex}
#confirm-bar.danger{background:#1a0000;border-color:var(--danger)}
#confirm-msg{flex:1;font-size:12px;color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#confirm-bar.danger #confirm-msg{color:var(--danger)}
#confirm-input{width:110px;background:var(--surface2);border:1px solid var(--warn);color:var(--text);padding:4px 8px;border-radius:4px;font-family:inherit;font-size:12px;outline:none}
#confirm-bar.danger #confirm-input{border-color:var(--danger)}
.conf-btn{padding:4px 12px;border-radius:4px;border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;white-space:nowrap}
#confirm-yes{background:var(--accent2);color:#0d1117}
#confirm-no{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}

/* Input bar */
#input-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
#prompt{color:var(--accent);font-size:13px;white-space:nowrap}
#cmd-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font:13px/1.4 'Cascadia Code','Fira Code',monospace;caret-color:var(--accent)}
#cmd-input::placeholder{color:var(--muted)}
#dryrun-toggle{font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--muted);white-space:nowrap;transition:all .15s}
#dryrun-toggle.on{background:#1f3a2a;border-color:var(--accent2);color:var(--accent2)}
#send-btn{font-size:12px;padding:5px 14px;border-radius:4px;cursor:pointer;background:var(--accent);border:none;color:#0d1117;font-weight:600;font-family:inherit;transition:opacity .15s}
#send-btn:hover{opacity:.85}
#send-btn:disabled{opacity:.4;cursor:not-allowed}

/* Sidebar */
#sidebar{width:var(--sidebar-w);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#sidebar.collapsed{width:0}
#panel-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.ptab{flex:1;padding:8px 2px;font-size:10px;text-align:center;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptab.active{color:var(--accent);border-color:var(--accent)}
.ptab:hover{color:var(--text)}
.panel{display:none;flex:1;overflow-y:auto;padding:12px}
.panel.active{display:block}
.panel::-webkit-scrollbar{width:5px}
.panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Tools panel */
.tool-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.tool-item:last-child{border-bottom:none}
.tool-name{font-size:11px;color:var(--accent);font-weight:600}
.tool-desc{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.4}
.risk-badge{font-size:9px;padding:1px 5px;border-radius:3px;white-space:nowrap;flex-shrink:0;font-weight:700;margin-top:2px}
.risk-low{background:#1a2e1a;color:var(--accent2)}
.risk-medium{background:#2e2200;color:var(--warn)}
.risk-high{background:#2e0a0a;color:var(--danger)}
.domain-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:10px 0 4px}
.domain-label:first-child{padding-top:0}

/* Settings panel */
.setting-group{margin-bottom:14px}
.setting-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.setting-value{font-size:12px;color:var(--text);padding:6px 8px;background:var(--surface2);border-radius:4px;border:1px solid var(--border)}
.setting-input{width:100%;font-size:12px;color:var(--text);padding:6px 8px;background:var(--surface2);border-radius:4px;border:1px solid var(--border);font-family:inherit;outline:none}
.setting-input:focus{border-color:var(--accent)}
select.setting-input option{background:var(--surface2)}
.api-notice{font-size:10px;color:var(--warn);background:#1e1800;border:1px solid #3d2e00;border-radius:4px;padding:8px;margin-bottom:12px;white-space:pre-wrap;line-height:1.5}
.api-notice.ok{color:var(--accent2);background:#0d1a0f;border-color:#1a3a1a}
.save-btn{width:100%;padding:7px;border-radius:4px;border:none;cursor:pointer;background:var(--accent);color:#0d1117;font-weight:700;font-family:inherit;font-size:12px;margin-top:4px}
.save-btn:hover{opacity:.85}
.setting-sep{border:none;border-top:1px solid var(--border);margin:12px 0}
.wa-section-title{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#25D366;margin-bottom:8px}
.wa-check{display:flex;align-items:center;gap:7px;font-size:10px;padding:4px 7px;border-radius:4px;margin-bottom:3px}
.wa-check.set{color:#25D366;background:#071a0a;border:1px solid #1a3a1a}
.wa-check.unset{color:var(--warn);background:#1e1800;border:1px solid #3d2e00}
.wa-step{display:flex;gap:8px;padding:3px 0;font-size:10px;color:var(--muted);line-height:1.5}
.wa-step-num{color:#25D366;font-weight:700;flex-shrink:0;width:14px;text-align:right}
.wa-step a{color:var(--accent);text-decoration:none}
.wa-step a:hover{text-decoration:underline}
.wa-test-btn{width:100%;padding:7px;border-radius:4px;border:1px solid #25D366;cursor:pointer;background:transparent;color:#25D366;font-weight:700;font-family:inherit;font-size:12px;margin-top:4px;transition:background .15s}
.wa-test-btn:hover{background:#071a0a}
#wa-test-result{font-size:10px;margin-top:6px;padding:5px 8px;border-radius:4px;display:none}
#wa-test-result.ok{display:block;color:#25D366;background:#071a0a;border:1px solid #1a3a1a}
#wa-test-result.err{display:block;color:var(--danger);background:#1a0505;border:1px solid #3a0a0a}
.wa-webhook-box{font-size:10px;padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;word-break:break-all;color:var(--text);cursor:pointer;margin-top:4px}
.wa-webhook-box:hover{border-color:var(--accent)}

/* History panel */
.hist-item{padding:8px 0;border-bottom:1px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.hist-cmd{font-size:11px;color:var(--text)}
.hist-meta{font-size:9px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.hist-status{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700}
.s-completed{background:#1a2e1a;color:var(--accent2)}
.s-failed{background:#2e0a0a;color:var(--danger)}
.s-cancelled{background:#2e2200;color:var(--warn)}
.s-executing{background:#0d1e3a;color:var(--accent)}
.s-dry_run{background:#1e1e1e;color:var(--muted)}

/* Audit panel */
.audit-item{padding:6px 0;border-bottom:1px solid var(--border);font-size:10px}
.audit-item:last-child{border-bottom:none}
.audit-event{color:var(--accent);font-weight:600}
.audit-tool{color:var(--accent2)}
.audit-meta{color:var(--muted);margin-top:2px}

/* Onboarding modal */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100}
#modal-overlay.hidden{display:none}
#modal{background:var(--surface);border:1px solid var(--border);border-radius:8px;width:min(640px,92vw);max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
#modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;color:var(--accent)}
#modal-body{padding:16px 18px;overflow-y:auto;flex:1;font-size:12px;line-height:1.7}
#modal-body pre{white-space:pre-wrap;font-family:inherit}
#modal-ftr{padding:12px 18px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modal-btn{padding:7px 18px;border-radius:4px;border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700}
#btn-accept{background:var(--accent2);color:#0d1117}
#btn-decline{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
#prov-sel{padding:5px 10px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:12px}
#prov-sel option{background:var(--surface2)}
</style>
</head>
<body>

<!-- Onboarding modal -->
<div id="modal-overlay" class="hidden">
  <div id="modal">
    <div id="modal-hdr">🔒 PACCA v5.2 — First Run Setup</div>
    <div id="modal-body"><pre id="disclosure-text">Loading disclosure…</pre></div>
    <div id="modal-ftr">
      <label style="font-size:11px;color:var(--muted)">Provider:</label>
      <select id="prov-sel">
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="openai">OpenAI (GPT)</option>
      </select>
      <div class="spacer"></div>
      <button class="modal-btn" id="btn-decline">Decline</button>
      <button class="modal-btn" id="btn-accept">Accept &amp; Start PACCA</button>
    </div>
  </div>
</div>

<!-- Header -->
<div id="header">
  <div id="logo">PACCA v5.2 <span>Personal AI Computer-Control Agent</span></div>
  <div id="status-dot" title="Connecting…"></div>
  <div id="provider-badge">offline</div>
  <div id="wa-badge" title="WhatsApp not configured">WhatsApp ✗</div>
  <div class="spacer"></div>
  <button class="hdr-btn" onclick="switchPanel('tools')">Tools ▸</button>
  <button class="hdr-btn" onclick="switchPanel('history')">History</button>
  <button class="hdr-btn" onclick="switchPanel('audit')">Audit</button>
  <button class="hdr-btn" onclick="switchPanel('settings')">⚙ Settings</button>
  <button class="hdr-btn" id="btn-toggle" onclick="toggleSidebar()">◀</button>
</div>

<!-- Main layout -->
<div id="main">
  <!-- Terminal column -->
  <div id="terminal-wrap">
    <div id="xterm-container"></div>

    <div id="progress-wrap">
      <div id="progress-track"><div id="progress-fill"></div></div>
      <div id="progress-label"></div>
    </div>

    <div id="confirm-bar">
      <div id="confirm-msg"></div>
      <input id="confirm-input" placeholder="type YES" autocomplete="off" spellcheck="false">
      <button class="conf-btn" id="confirm-yes">✓ Confirm</button>
      <button class="conf-btn" id="confirm-no">✗ Cancel</button>
    </div>

    <div id="input-bar">
      <span id="prompt">pacca ›</span>
      <input id="cmd-input" placeholder="Type a command…  (try 'help')" autocomplete="off" spellcheck="false">
      <button id="dryrun-toggle" onclick="toggleDryRun()" title="Preview plan without executing">dry-run</button>
      <button id="send-btn" onclick="sendCommand()">Send ↵</button>
    </div>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="panel-tabs">
      <div class="ptab active" onclick="switchPanel('tools')" id="tab-tools">Tools</div>
      <div class="ptab" onclick="switchPanel('history')" id="tab-history">History</div>
      <div class="ptab" onclick="switchPanel('audit')" id="tab-audit">Audit</div>
      <div class="ptab" onclick="switchPanel('settings')" id="tab-settings">⚙</div>
    </div>
    <div class="panel active" id="panel-tools"><div style="color:var(--muted);font-size:11px">Loading tools…</div></div>
    <div class="panel" id="panel-history"><div style="color:var(--muted);font-size:11px">No tasks yet.</div></div>
    <div class="panel" id="panel-audit"><div style="color:var(--muted);font-size:11px">No audit entries yet.</div></div>
    <div class="panel" id="panel-settings"><div style="color:var(--muted);font-size:11px">Loading…</div></div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
const S = {
  ws:null, term:null, fit:null,
  cmdHistory:[], histIdx:-1,
  dryRun:false, sidebarOpen:true,
  taskId:null, confirmId:null,
  totalSteps:0, doneSteps:0,
};

// ── Colour codes ──────────────────────────────────────────────────────────────
const C = {
  rst:'\x1b[0m', bold:'\x1b[1m', dim:'\x1b[2m',
  blue:'\x1b[34m', cyan:'\x1b[36m', green:'\x1b[32m',
  yellow:'\x1b[33m', red:'\x1b[31m', mag:'\x1b[35m',
  white:'\x1b[97m', gray:'\x1b[90m',
};
const pr  = t => S.term && S.term.writeln(t);
const sep = () => pr(C.gray+'─'.repeat(58)+C.rst);
const ts  = () => C.gray+new Date().toLocaleTimeString()+C.rst+' ';

// ── Terminal init ─────────────────────────────────────────────────────────────
function initTerm() {
  S.term = new Terminal({
    theme:{
      background:'#0d1117',foreground:'#e6edf3',cursor:'#58a6ff',
      black:'#0d1117',red:'#f85149',green:'#3fb950',yellow:'#e3b341',
      blue:'#58a6ff',magenta:'#bc8cff',cyan:'#39c5cf',white:'#e6edf3',
      brightBlack:'#484f58',brightRed:'#ff7b72',brightGreen:'#56d364',
      brightYellow:'#e3b341',brightBlue:'#79c0ff',
      brightMagenta:'#d2a8ff',brightCyan:'#56d4dd',brightWhite:'#f0f6fc',
    },
    fontFamily:"'Cascadia Code','Fira Code','Courier New',monospace",
    fontSize:13,lineHeight:1.4,cursorBlink:true,cursorStyle:'bar',
    scrollback:5000,convertEol:true,
  });
  S.fit = new FitAddon.FitAddon();
  S.term.loadAddon(S.fit);
  S.term.open(document.getElementById('xterm-container'));
  S.fit.fit();
  window.addEventListener('resize', () => S.fit && S.fit.fit());
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connectWS() {
  const proto = location.protocol==='https:'?'wss:':'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws`);
  S.ws = ws;
  ws.onopen  = () => dot('ok');
  ws.onclose = () => {
    dot('warn');
    badge('disconnected','');
    pr(C.yellow+'⚠ Disconnected — reconnecting in 3s…'+C.rst);
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => {};
  ws.onmessage = e => {
    try {
      const m = JSON.parse(e.data);
      route(m.type, m.data||{});
    } catch(_){}
  };
}

function wsSend(obj) {
  if (S.ws && S.ws.readyState===1) S.ws.send(JSON.stringify(obj));
}

function dot(cls) {
  document.getElementById('status-dot').className = cls;
}
function badge(text, cls) {
  const el = document.getElementById('provider-badge');
  el.textContent = text;
  el.className   = cls;
}
function waBadge(configured) {
  const el = document.getElementById('wa-badge');
  if (configured) {
    el.textContent = 'WhatsApp ✓';
    el.className = 'live';
    el.title = 'WhatsApp connected';
  } else {
    el.textContent = 'WhatsApp ✗';
    el.className = '';
    el.title = 'WhatsApp not configured — see help for setup';
  }
}

// ── Event router ──────────────────────────────────────────────────────────────
function route(type, d) {
  switch(type) {
    case 'welcome':              onWelcome(d); break;
    case 'status':               pr(ts()+C.gray+d.message+C.rst); break;
    case 'warning':              pr(ts()+C.yellow+'⚠ '+d.message+C.rst); break;
    case 'scope':                onScope(d); break;
    case 'plan':                 onPlan(d); break;
    case 'executing':            pr(ts()+C.cyan+'▶ Executing…'+C.rst); break;
    case 'step_start':           onStepStart(d); break;
    case 'step_complete':        onStepComplete(d); break;
    case 'step_error':           pr(ts()+C.red+'  ✖ '+d.error+C.rst); break;
    case 'completed':            onCompleted(d); break;
    case 'dry_run_complete':     onDryRunDone(d); break;
    case 'cancelled':            pr(ts()+C.yellow+'⊘ Cancelled: '+(d.reason||'')+C.rst); hideConfirm(); hideProgress(); break;
    case 'error':                pr(ts()+C.red+'✖ '+(d.message||'Error')+C.rst); hideConfirm(); hideProgress(); break;
    case 'confirmation_required':onConfirmReq(d); break;
    case 'help':                 onHelp(d); break;
    case 'tools':                onToolsTxt(d); break;
    case 'status_info':          onStatusInfo(d); break;
    case 'undo_result':          onUndoResult(d); break;
    case 'history':              onHistoryTxt(d); break;
    case 'audit_log':            onAuditTxt(d); break;
    case 'disclosure':           showModal(d.text); break;
    default: break;
  }
}

// ── Event handlers ────────────────────────────────────────────────────────────
function onWelcome(d) {
  badge(d.provider+' / '+d.model, d.llm_available?'live':'');
  dot('ok');
  pr('');
  pr(C.bold+C.blue+'  PACCA v5.2'+C.rst+C.gray+'  Personal AI Computer-Control Agent'+C.rst);
  pr('  '+C.gray+'──────────────────────────────────────────────────────'+C.rst);
  if (d.llm_available) {
    pr('  '+C.green+'✓ Connected'+C.rst+C.gray+'  '+d.provider+' / '+C.white+d.model+C.rst);
  } else {
    pr('  '+C.yellow+'⚠ No API key — heuristic (demo) mode'+C.rst);
    pr('  '+C.gray+'Add '+C.yellow+'ANTHROPIC_API_KEY'+C.gray+' or '+C.yellow+'OPENAI_API_KEY'+C.gray+' in Replit Secrets ⚙'+C.rst);
  }
  pr('  '+C.gray+'Type a command and press Enter  •  '+C.cyan+'help'+C.gray+' for usage guide'+C.rst);
  pr('');
  if (!d.onboarding_complete) fetchAndShowModal();
  loadTools();
  loadSettings();
}

function onScope(d) {
  S.taskId = d.task_id;
  pr(ts()+C.gray+'Scope: '+C.mag+d.intent_domain+C.rst+C.gray+' / '+d.intent_verb+(d.dry_run?' [DRY-RUN]':'')+C.rst);
}

function onPlan(d) {
  S.taskId = d.task_id;
  S.totalSteps = d.steps.length;
  S.doneSteps  = 0;
  const rc = d.risk_score>=200?C.red:d.risk_score>=100?C.yellow:C.green;
  pr('');
  pr(C.bold+C.white+'  PLAN'+(d.dry_run?' [DRY-RUN]':'')+C.rst+C.gray+'  '+d.steps.length+' step'+(d.steps.length!==1?'s':'')+
     '   risk '+rc+Math.round(d.risk_score)+C.rst+(d.risk_gate?' ['+d.risk_gate+']':''));
  sep();
  d.steps.forEach((s,i) => {
    const rl = (s.risk_level||'low').toUpperCase();
    const rc2 = rl==='HIGH'?C.red:rl==='MEDIUM'?C.yellow:C.green;
    const rev = s.reversible?'':C.gray+' ⚠irreversible'+C.rst;
    pr('  '+C.gray+(i+1)+'.'+C.rst+' '+C.cyan+s.tool+C.rst+' '+rc2+'['+rl+']'+C.rst+rev+'  '+C.gray+(s.description||'')+C.rst);
    Object.entries(s.args_preview||{}).forEach(([k,v]) => {
      if (v) pr('     '+C.gray+k+': '+C.dim+String(v).substring(0,72)+C.rst);
    });
  });
  sep();
  if (d.steps.length && !d.dry_run) showProgress(0, d.steps.length, 'Starting…');
}

function onStepStart(d) {
  pr(ts()+C.cyan+'  → ['+d.step_number+'/'+d.total_steps+'] '+d.tool+C.rst+C.gray+'  '+(d.description||'')+C.rst);
}

function onStepComplete(d) {
  S.doneSteps++;
  updateProgress(S.doneSteps, S.totalSteps, d.tool);
  const res = d.result||{};

  if (res.error) {
    pr(ts()+C.red+'  ✖ '+res.error+C.rst);
    return;
  }

  // Infer display from result shape
  if (res.entries && Array.isArray(res.entries)) {
    res.entries.slice(0,40).forEach(e => {
      const obj = typeof e==='object'?e:{name:e};
      const isDir = obj.is_dir||obj.type==='directory';
      pr('  '+(isDir?'📁 '+C.cyan:' 📄 '+C.white)+(obj.name||String(e))+C.rst+(obj.size_str?' '+C.gray+obj.size_str+C.rst:''));
    });
    if ((res.total_count||0)>40) pr('  '+C.gray+'… and '+(res.total_count-40)+' more'+C.rst);
  } else if (res.content) {
    const lines = String(res.content).split('\n');
    pr(C.gray+'  ┌─ content ('+lines.length+' lines) ──'+C.rst);
    lines.slice(0,30).forEach(l => pr('  │ '+C.dim+l.substring(0,100)+C.rst));
    if (lines.length>30) pr('  │ '+C.gray+'… ('+( lines.length-30)+' more lines)'+C.rst);
    pr(C.gray+'  └────'+C.rst);
  } else if (res.results && Array.isArray(res.results)) {
    res.results.slice(0,25).forEach(r => pr('  📄 '+C.white+(r.path||r)+C.rst));
    if (res.count>25) pr('  '+C.gray+'… and '+(res.count-25)+' more'+C.rst);
  } else if (res.cpu_percent!==undefined) {
    pr('  CPU: '+C.yellow+res.cpu_percent+'%'+C.rst+'   RAM: '+C.yellow+res.ram_percent+'%'+C.rst+'   Disk: '+C.yellow+(res.disk_usage_percent||'?')+'%'+C.rst);
    if (res.uptime_str) pr('  Uptime: '+C.gray+res.uptime_str+C.rst);
    if (res.top_processes) {
      pr('  '+C.gray+'Top processes:'+C.rst);
      res.top_processes.slice(0,5).forEach(p => {
        pr('    '+C.dim+(p.name||p.pid||'?').padEnd(20)+'cpu:'+p.cpu+'%  mem:'+p.memory+'%'+C.rst);
      });
    }
  } else if (res.apps && Array.isArray(res.apps)) {
    res.apps.slice(0,20).forEach(a => pr('  '+C.green+(a.name||a)+C.rst+(a.pid?' '+C.gray+'['+a.pid+']'+C.rst:'')));
  } else if (res.output) {
    String(res.output).split('\n').slice(0,30).forEach(l => pr('  '+C.gray+l.substring(0,100)+C.rst));
  } else if (res.text) {
    String(res.text).split('\n').slice(0,20).forEach(l => pr('  '+C.dim+l.substring(0,100)+C.rst));
  }

  // Short success summary
  const snippets = [];
  for (const [k,v] of Object.entries(res)) {
    if (['content','entries','results','apps','output','top_processes','text'].includes(k)) continue;
    if (typeof v==='string'&&v.length<=80) snippets.push(k+': '+v.substring(0,50));
    else if (typeof v==='number') snippets.push(k+': '+v);
    else if (typeof v==='boolean') snippets.push(k+': '+v);
  }
  if (snippets.length) pr(C.green+'  ✓ '+snippets.slice(0,3).join('  ')+C.rst);
  else pr(C.green+'  ✓ done'+C.rst);
}

function onCompleted(d) {
  hideProgress();
  const ok = (d.results_summary||[]).filter(r=>r.success).length;
  const tot = (d.results_summary||[]).length;
  pr('');
  pr(C.bold+C.green+'  ✓ Task complete'+C.rst+C.gray+'  '+ok+'/'+tot+' steps succeeded'+C.rst);
  if (d.can_undo) pr('  '+C.gray+'Tip: type '+C.cyan+'undo'+C.gray+' to reverse the last action'+C.rst);
  pr('');
  loadHistory(); loadAudit();
}

function onDryRunDone(d) {
  hideProgress();
  pr('');
  pr(C.bold+C.yellow+'  ◎ Dry-run complete'+C.rst+C.gray+'  '+d.steps+' step'+(d.steps!==1?'s':'')+' planned  risk: '+Math.round(d.risk_score)+C.rst);
  pr('  '+C.gray+'No tools were executed.'+C.rst);
  pr('');
}

function onConfirmReq(d) {

  pr('');

}

function onHelp(d) {

function onToolsTxt(d) {

function onStatusInfo(d) {

  pr('  Model:      '+C.white+d.model+C.rst);

function onUndoResult(d) {

}

function onHistoryTxt(d) {

    pr('  '+sc+(r.status==='completed'?'[+]':r.status==='failed'?'[!]':'[-]')+C.rst+' '+(r.command_short||r.command_redacted||'').substring(0,60));
    pr('    '+C.gray+r.intent_domain+'  '+(r.duration_s!=null?r.duration_s+'s':'')+'  '+r.steps_executed+'/'+r.steps_total+' steps'+C.rst);

    pr('  '+C.gray+(e.event_type||e.raw||'?')+C.rst+(e.tool_name?'  '+C.cyan+e.tool_name+C.rst:''));

// ── Confirm bar ───────────────────────────────────────────────────────────────
function showConfirmBar(msg, isDanger) {
  const bar = document.getElementById('confirm-bar');
  document.getElementById('confirm-msg').textContent = msg.substring(0,120);
  document.getElementById('confirm-input').value = '';
  bar.className = 'show'+(isDanger?' danger':'');
  document.getElementById('confirm-input').focus();
}
function hideConfirm() {
  document.getElementById('confirm-bar').className = '';
  S.confirmId = null;
}
function submitConfirm(accept) {
  const resp = accept ? (document.getElementById('confirm-input').value||'YES') : 'NO';
  const tid = S.taskId, cid = S.confirmId;
  if (!tid||!cid) { hideConfirm(); return; }
  wsSend({type:'confirm',data:{task_id:tid,confirmation_id:cid,response:resp}});
  hideConfirm();
  if (!accept) wsSend({type:'cancel',data:{task_id:tid}});
}
document.getElementById('confirm-yes').onclick = () => submitConfirm(true);
document.getElementById('confirm-no').onclick  = () => submitConfirm(false);
document.getElementById('confirm-input').addEventListener('keydown', e => {
  if (e.key==='Enter') submitConfirm(true);
  if (e.key==='Escape') submitConfirm(false);
});

// ── Progress ──────────────────────────────────────────────────────────────────
function showProgress(done, total, lbl) {
  document.getElementById('progress-wrap').classList.add('show');
  updateProgress(done, total, lbl);
}
function updateProgress(done, total, lbl) {
  const pct = total>0?Math.round(done/total*100):0;
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-label').textContent = (lbl||'')+' — '+done+' / '+total;
}
function hideProgress() {
  document.getElementById('progress-wrap').classList.remove('show');
  document.getElementById('progress-fill').style.width = '0';
}

// ── Command input ─────────────────────────────────────────────────────────────
function sendCommand() {
  const input = document.getElementById('cmd-input');
  const cmd = input.value.trim();
  if (!cmd) return;

  let finalCmd = cmd;
  if (S.dryRun && !cmd.toLowerCase().startsWith('dry-run:') && !cmd.toLowerCase().startsWith('dry run:')) {
    finalCmd = 'dry-run: '+cmd;
  }

  S.cmdHistory.unshift(cmd);
  if (S.cmdHistory.length>100) S.cmdHistory.pop();
  S.histIdx = -1;

  pr('');
  pr(C.bold+C.blue+'› '+C.rst+C.white+cmd+C.rst+(S.dryRun?C.yellow+' [dry-run]'+C.rst:''));

  wsSend({type:'command',data:{command:finalCmd}});
  input.value = '';
  input.focus();
}

document.getElementById('cmd-input').addEventListener('keydown', e => {
  if (e.key==='Enter') { sendCommand(); return; }
  if (e.key==='ArrowUp') {
    S.histIdx = Math.min(S.histIdx+1, S.cmdHistory.length-1);
    e.target.value = S.cmdHistory[S.histIdx]||'';
    e.preventDefault(); return;
  }
  if (e.key==='ArrowDown') {
    S.histIdx = Math.max(S.histIdx-1, -1);
    e.target.value = S.histIdx>=0?S.cmdHistory[S.histIdx]:'';
    e.preventDefault(); return;
  }
});

function switchPanel(name) {
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const tab = document.getElementById('tab-'+name);
  const panel = document.getElementById('panel-'+name);
  if (tab) tab.classList.add('active');
  if (panel) panel.classList.add('active');
  if (!S.sidebarOpen) toggleSidebar();
  if (name==='history') loadHistory();
  if (name==='audit') loadAudit();
  if (name==='settings') loadSettings();
}

async function loadTools() {
  try {
    const r = await fetch('/api/tools');
    const d = await r.json();
    renderTools(d.tools||[]);
  } catch(_){}
}

function renderTools(tools) {
  const c = document.getElementById('panel-tools');
  const groups = {};
  tools.forEach(t => { (groups[t.domain]||(groups[t.domain]=[])).push(t); });
  c.innerHTML = '';
  for (const [dom, items] of Object.entries(groups)) {
    const lbl = document.createElement('div');
    lbl.className='domain-label';
    lbl.textContent = dom.toUpperCase()+' ('+items.length+')';
    c.appendChild(lbl);
    items.forEach(t => {
      const div = document.createElement('div');
      div.className = 'tool-item';
      const rl = (t.risk_level||'low').toLowerCase();
      const badges = [
        t.reversible?'<span style="font-size:9px;color:var(--accent2)">↩rev</span>':'',
        t.data_egress?'<span style="font-size:9px;color:var(--warn)">☁egress</span>':'',
        t.requires_confirmation?'<span style="font-size:9px;color:var(--danger)">⚠confirm</span>':'',
        t.undo_supported?'<span style="font-size:9px;color:var(--muted)">undo</span>':'',
      ].filter(Boolean).join(' ');
      div.innerHTML=`<div style="flex:1;min-width:0">
        <div class="tool-name">${esc(t.name)}</div>
        <div class="tool-desc">${esc(t.description)}</div>
        <div style="margin-top:3px;display:flex;gap:4px;flex-wrap:wrap">${badges}</div>
      </div><div><span class="risk-badge risk-${rl}">${rl}</span></div>`;
      c.appendChild(div);
    });
  }
}

  p.innerHTML='';

    const div = document.createElement('div');
    div.className='hist-item';
    const dur = r.duration_s!=null?r.duration_s+'s':'';
    const risk = r.risk_score?'risk:'+Math.round(r.risk_score):'';
    div.innerHTML=`<div class="hist-cmd">${esc((r.command_short||r.command_redacted||'').substring(0,65))}</div>
      <div class="hist-meta">
        <span class="hist-status s-${esc(r.status)}">${esc(r.status)}</span>
        <span>${esc(r.intent_domain)}</span>
        ${dur?'<span>'+dur+'</span>':''}
        ${risk?'<span>'+risk+'</span>':''}
        <span>${r.steps_executed}/${r.steps_total}</span>

    p.appendChild(div);
  });

async function saveSettings() {
  const body = {
    provider: document.getElementById('s-prov').value,
    model:    document.getElementById('s-model').value,
    risk_confirm_threshold: parseFloat(document.getElementById('s-confirm').value||200),
    risk_proceed_threshold: parseFloat(document.getElementById('s-proceed').value||100),
  };
  try {
    await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    pr(ts()+C.green+'✓ Settings saved — reconnecting…'+C.rst);
    setTimeout(() => { if(S.ws) S.ws.close(); }, 600);
  } catch(e) {
    pr(ts()+C.red+'✖ Save failed: '+e+C.rst);
  }
}

async function testWA() {
  const el = document.getElementById('wa-test-result');
  if (!el) return;
  el.className = '';
  el.style.display = 'block';
  el.textContent = 'Testing connection…';
  try {
    const r = await fetch('/api/whatsapp-test');
    const d = await r.json();
    if (d.ok) {
      el.className = 'ok';
      el.textContent = '✓ Connected — ' + (d.phone||'') + (d.name?' ('+d.name+')':'') + (d.quality?' · quality: '+d.quality:'');
    } else {
      el.className = 'err';
      el.textContent = '✗ ' + (d.error||'Unknown error') + (d.detail ? '\n'+d.detail : '');
    }
  } catch(e) {
    el.className = 'err';
    el.textContent = '✗ Request failed: ' + e;
  }
}

function copyWebhookUrl(url) {
  navigator.clipboard.writeText(url).then(() => {
    const boxes = document.querySelectorAll('.wa-webhook-box');
    boxes.forEach(b => {
      const orig = b.textContent;
      b.textContent = '✓ Copied!';
      b.style.color = '#25D366';
      setTimeout(() => { b.textContent = orig; b.style.color = ''; }, 1500);
    });
  }).catch(() => {
    prompt('Copy this URL:', url);
  });
}

async function undoLast() {
  try {
    const r = await fetch('/api/undo',{method:'POST'});
    const d = await r.json();
    route('undo_result', d);
  } catch(_){}
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  initTerm();
  connectWS();
  document.getElementById('cmd-input').focus();
  document.getElementById('xterm-container').addEventListener('click', () => {
    document.getElementById('cmd-input').focus();
  });
  // Check if onboarding needed
  fetch('/api/status').then(r=>r.json()).then(d=>{
    if (!d.onboarding_complete) fetchAndShowModal();
    waBadge(!!d.whatsapp_configured);
  }).catch(()=>{});
});
